# Local stack: Postgres + the app (API and UI on http://localhost:10000).
# Needs LLM_API_KEY in .env (free key from https://console.groq.com/keys).
version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-financial_agent}
      POSTGRES_USER: ${DB_OWNER_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_OWNER_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      PORT: "10000"
    ports:
      - "10000:10000"

volumes:
  pgdata:
